
;LPU230Lock OPOS Service object control ini
[LogSetting]
logenable = 0
loglevel = 3
logtimestemp = 1
logtimetick = 1

[keylock]
; ibutton data size 6 byte or 8 bytes( default )
size = 8

; 0 - not generates exception in setbinaryconversion request.( from v1.14.2)
; In this case, binaryconversion default value is OPOS_BC_DECIMAL.
;
; 1 - generates exception in setbinaryconversion request.( default, for compatability, less then v1.14.2)  
; In this case, binaryconversion default value is OPOS_BC_NIBBLE.
; this case is missing code, but older user can be need this action for compatability.
generate_exception_setbinaryconversion = 1
