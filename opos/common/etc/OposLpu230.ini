;LPU230 OPOS Service object control ini

[LogSetting]
logenable = 0
loglevel = 3
logtimestemp = 1
logtimetick = 1

[event]
;fire or not error-event when magnetic card reading error in MSR_ERT_CARD setting
;default enable_ertcard_ms_error=0
enable_ertcard_ms_error=0

;fire or not error-event when magnetic card reading error in MSR_ERT_TRACK setting
;default enable_erttrack_ms_error=1
enable_erttrack_ms_error=1

;fire or not error-event when commuication error.
;default enable_commuicate_error=1
enable_commuicate_error=1
