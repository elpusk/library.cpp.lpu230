[package]
name = "mcp-svr-lpu23x"
version = "0.1.0"
edition = "2024"

[dependencies]
# 비동기 런타임
tokio = { version = "1.0", features = ["full"] }
# JSON-RPC 및 MCP 규격 처리
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 동적 라이브러리(DLL/SO) 로딩
libloading = "0.8"
# 멀티플랫폼 C 타입 지원
libc = "0.2"
# 비동기 스트림 처리
futures = "0.3"
