[package]
name = "msr-mcp"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "lpu23x-msr-mcp"
path = "src/main.rs"

[dependencies]
lpu237-common = { path = "../../libs/lpu237-common" }
tg-lpu237-dll = { path = "../../libs/tg-lpu237-dll" }
rmcp = { version = "1.5.0", features = ["macros", "server", "transport-io"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
once_cell = "1.19"
schemars = { version = "1.2", features = ["derive"] }
anyhow = "1.0"

[build-dependencies]
winres = "0.1"