[package]
name = "ibutton-mcp"
version = "1.1.0"
edition = "2024"

[[bin]]
name = "lpu23x-ibutton-mcp"
path = "src/main.rs"

[dependencies]
lpu237-common = { path = "../../libs/lpu237-common" }
tg-lpu237-ibutton = { path = "../../libs/tg-lpu237-ibutton" }
rmcp = { version = "1.5.0", features = ["macros", "server", "transport-io"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
once_cell = "1.19"
schemars = { version = "1.2", features = ["derive"] }
anyhow = "1.0"
hex = "0.4.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[build-dependencies]
winres = "0.1"